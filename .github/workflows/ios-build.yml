name: Build iOS IPA

on:
  push:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system tools
        run: |
          brew install cmake ninja pkg-config

      - name: Get iOS CMake toolchain
        run: |
          git clone --depth 1 https://github.com/leetal/ios-cmake.git

      - name: Configure CMake for iOS
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -G Xcode \
            -DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/ios-cmake/ios.toolchain.cmake \
            -DPLATFORM=OS64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DDEPLOYMENT_TARGET=13.0 \
            -DENABLE_BITCODE=OFF \
            -DENABLE_ARC=OFF \
            -DENABLE_VISIBILITY=OFF \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -Wno-dev

      - name: Build
        run: |
          cd build
          cmake --build . --config Release --target SRB2SDL2 -j$(sysctl -n hw.ncpu) || \
          cmake --build . --config Release -j$(sysctl -n hw.ncpu)

      - name: Locate the .app or binary
        id: find_app
        run: |
          echo "=== Looking for built files ==="
          find build -type d -name "*.app" 2>/dev/null || true
          find build -type f -name "srb2*" 2>/dev/null || true
          find build/bin -type f 2>/dev/null || true

          APP_PATH=$(find build -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            BIN_PATH=$(find build -type f -executable -name "srb2*" | head -1)
            if [ -n "$BIN_PATH" ]; then
              echo "Found binary (no .app yet): $BIN_PATH"
              echo "app_path=" >> $GITHUB_OUTPUT
              echo "bin_path=$BIN_PATH" >> $GITHUB_OUTPUT
            else
              echo "Could not find srb2.app or binary"
              exit 1
            fi
          else
            echo "Found app at: $APP_PATH"
            echo "app_path=$APP_PATH" >> $GITHUB_OUTPUT
            echo "bin_path=" >> $GITHUB_OUTPUT
          fi

      - name: Package unsigned IPA
        if: steps.find_app.outputs.app_path != ''
        run: |
          mkdir -p Payload
          cp -R "${{ steps.find_app.outputs.app_path }}" Payload/
          zip -r srb2.ipa Payload
          ls -lh srb2.ipa

      - name: Upload IPA
        if: steps.find_app.outputs.app_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: srb2-ios-ipa
          path: srb2.ipa

      - name: Upload binary
        if: steps.find_app.outputs.bin_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: srb2-ios-binary
          path: ${{ steps.find_app.outputs.bin_path }}
